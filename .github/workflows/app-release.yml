name: App release

# Ships the Flutter app to TestFlight and to Play (ADR 0013) in two stages.
#
# Every merge to main that touches the app uploads to the internal stage of
# both stores: the TestFlight `Team` group (it has access to all builds) and
# the Play `internal` track. No outside tester sees those. Both jobs share
# one monotonic build number.
#
# A manual run (workflow_dispatch) is the beta release: it builds nothing and
# promotes a build already on the internal stage — the newest, or the one
# named by `build_number` — to the external TestFlight group `Beta` and the
# closed Play track `alpha`. That is where the waits are: the first build of
# a version goes through Beta App Review (Apple takes one submission per
# version at a time, so the iOS job refuses while one is pending), and Play
# reviews every closed-testing release. Neither wait is inside the run.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: >-
          Build number to promote on both stores (e.g. 1027). Empty means the
          newest build on each store's internal stage.
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      # The Dart contract is pinned against the emitted JSON Schema.
      - 'packages/contract/contract.schema.json'
      - '.github/workflows/app-release.yml'

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  ios-internal:
    if: github.event_name == 'push'
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26),
    # which this image carries by default.
    runs-on: macos-26
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      # match pulls the certificate + profile from the private repo.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - run: flutter pub get
      # Monotonic, and above anything the legacy app shipped (ADR 0012).
      # Expressions cannot do arithmetic, hence the shell.
      - run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: bundle exec fastlane ios internal
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

  android-internal:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      # The upload keystore and its key.properties, straight from secrets.
      # key.properties points at ../upload-keystore.jks relative to the app
      # module, i.e. android/upload-keystore.jks.
      - run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      - run: flutter pub get
      - run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: bundle exec fastlane android internal
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

  # The beta stage: store API calls only, so no Xcode, no Flutter, no macOS.
  ios-beta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane ios beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          PROMOTE_BUILD_NUMBER: ${{ inputs.build_number }}

  android-beta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      - run: bundle exec fastlane android beta
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PROMOTE_BUILD_NUMBER: ${{ inputs.build_number }}
