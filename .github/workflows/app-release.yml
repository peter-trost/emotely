name: App release

# Ships the Flutter app to TestFlight and to Play (ADR 0013). Every build goes
# to the external TestFlight group `Beta` (the internal `Team` group sees every
# build by itself), and to the
# Play `internal` track plus the closed `alpha` track — so outside beta testers
# get every build without a human touching a console.
# Continuous delivery: every merge to main that touches the app, plus manual
# runs. Both jobs share one monotonic build number.
#
# The iOS job waits for App Store Connect to finish processing (external
# distribution cannot skip it), so it runs 10-30 min longer than the build.
# The first build of a new version also goes through Beta App Review, and
# Play reviews every closed-testing release; both are expected waits that
# happen after this workflow is green.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      # The Dart contract is pinned against the emitted JSON Schema.
      - 'packages/contract/contract.schema.json'
      - '.github/workflows/app-release.yml'

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  ios:
    # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26),
    # which this image carries by default.
    runs-on: macos-26
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      # match pulls the certificate + profile from the private repo.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - run: flutter pub get
      # Monotonic, and above anything the legacy app shipped (ADR 0012).
      # Expressions cannot do arithmetic, hence the shell.
      - run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: bundle exec fastlane ios beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

  android:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: apps/mobile/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/app/.fvmrc
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: apps/mobile/app
          bundler-cache: true
      # The upload keystore and its key.properties, straight from secrets.
      # key.properties points at ../upload-keystore.jks relative to the app
      # module, i.e. android/upload-keystore.jks.
      - run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      - run: flutter pub get
      - run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: bundle exec fastlane android beta
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
