id: suppression-reason-dart
valid:
  # A reason of four or more words on the comment line above.
  - |
    void f() {
      // The picker still builds on material, so the bridge stays.
      // ignore: deprecated_member_use
      old();
    }
  # A reason of four or more words on the same line, after the rule names.
  - |
    void f() {
      old(); // ignore: deprecated_member_use, the bridge still needs it
    }
  # A directive that opens the file may take its reason from below.
  - |
    // coverage:ignore-file
    // The launch sequence; the graph it composes is tested elsewhere.

    void main() {}
  # Each directive of a stack carries its own reason.
  - |
    // jaspr_builder cannot read a primary constructor yet.
    // ignore_for_file: use_primary_constructors
    // The fix this rule proposes is the form the builder cannot parse.
    // ignore_for_file: unnecessary_type_name_in_constructor
    class A {}
  # Closing a range needs no reason; opening it does, and has one here.
  - |
    void f() {
      // The generated table below is data, not logic to test.
      // coverage:ignore-start
      g();
      // coverage:ignore-end
    }
  - |
    void f() {}
    // coverage:ignore-end
  - |
    // A state machine whose branches read best kept together.
    // cognitive_complexity:ignore
    void h() {}
  # A directive mentioned in prose is not a directive.
  - |
    // Never add a bare // ignore: here; see biome-ignore too.
    final s = '// ignore: x';
  # Known gaps (ADR 0018): ast-grep sees no line numbers, so a blank line
  # between the reason and the directive, or a reason trailing code on the
  # line above, still counts.
  - |
    void f() {
      // The picker still builds on material, so the bridge stays.

      // ignore: deprecated_member_use
      old();
    }
  - |
    void f() {
      final a = b; // the reason sits beside the code
      // ignore: deprecated_member_use
      old();
    }
invalid:
  # A bare ignore, of one rule or of several.
  - |
    void f() {
      // ignore: deprecated_member_use
      old();
    }
  - |
    void f() {
      // ignore: a_rule, b_rule
      older();
    }
  # Rule names are not words, however many there are.
  - |
    void f() {
      // ignore: a_rule, b_rule, c_rule, d_rule, e_rule
      older();
    }
  # Nor is the tail of a rule name split off from it.
  - |
    void f() {
      // ignore: deprecated_member_use a b c
      old();
    }
  # Fewer than four words above.
  - |
    void f() {
      // Needed here.
      // ignore: deprecated_member_use
      old();
    }
  # Fewer than four words on the same line.
  - |
    void f() {
      old(); // ignore: deprecated_member_use -- needed
    }
  # Another directive above is not a reason.
  - |
    // Both rules fire on the classic constructor form here.
    // ignore_for_file: use_primary_constructors
    // ignore_for_file: unnecessary_type_name_in_constructor
    class A {}
  # Code above is not a reason, even with a comment behind it.
  - |
    void f() {
      final a = b; // the reason sits beside the code
      old(); // ignore: deprecated_member_use
    }
  # A reason below counts only for a directive that opens the file.
  - |
    void f() {}
    // coverage:ignore-line
    // A reason below does not count away from the first line.
  - |
    // coverage:ignore-start
    f();
  - |
    void f() {
      // coverage:ignore-start
      g();
    }
  - |
    void g() {}
    // cognitive_complexity:ignore
    void h() {}
  - |
    void g() {}
    // cognitive_complexity:ignore_for_file
