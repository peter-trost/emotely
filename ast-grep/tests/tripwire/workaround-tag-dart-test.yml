id: workaround-tag-dart
valid:
  # Dart strings, however they are quoted, are not comments.
  - |
    final a = 'see // TODO';
    final b = "a // HACK: in a string";
    final c = r'raw // FIXME';
    final d = '''
    // TODO inside a multi-line string
    ''';
    final e = 'x ${f('// XXX')} y';
    final g = "it's // TODO";
  # Lower case is prose unless written as a tag.
  - |
    // Opens the todo list screen.
    void f() {}
invalid:
  # A TODO in a line comment.
  - |
    void f() {}
    // TODO: handle later
  # A tag counts in a documentation comment too.
  - |
    /// TODO: document
    void f() {}
  # The comment after a string that holds a comment opener.
  - |
    final u = 'https://x'; // TODO
  # A nested block comment, read to its true end.
  - |
    /* outer /* inner */ still a comment: TODO */ void f() {}
  # Lower case written as a tag.
  - |
    // todo(peter): later
    void f() {}
