id: suppression-reason-typescript
valid:
  # biome's reason follows the colon.
  - |
    const names = [
      // biome-ignore lint/security/noSecrets: a gateway error class name, not a secret
      "GatewayInvalidRequestError",
    ];
  # A reason on the comment line above.
  - |
    // Not a credential: the literal field name the gateway returns.
    // biome-ignore lint/security/noSecrets: gateway field name
    const KEY = "enabledDisallowPromptTraining";
  # A block comment above counts by its last line.
  - |
    /* The fixture is malformed on purpose. */
    // @ts-expect-error
    f(0);
  # Closing a range needs no reason.
  - |
    x;
    // biome-ignore-end lint/style/noMagicNumbers
  # TypeScript's own, with a reason on the same line.
  - |
    // @ts-expect-error the fixture is malformed on purpose here
    f(2);
invalid:
  - |
    x;
    // biome-ignore lint/security/noSecrets: ok
    y;
  - |
    x;
    // biome-ignore lint/style/noMagicNumbers
    y;
  - |
    x;
    // biome-ignore-start lint/style/noMagicNumbers: <explanation>
    y;
  - |
    // @ts-expect-error
    f(1);
  - |
    x;
    /* @ts-ignore */ f(3);
  # A directive on an inner line of a block comment is still one.
  - |
    x;
    /*
     * @ts-ignore
     */
    f(4);
