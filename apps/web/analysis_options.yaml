# Policy: deny-by-default lints (see AGENTS.md), the same rule set as
# apps/app; flutter_agent_lints has no Flutter dependency, its Flutter-only
# rules simply never fire here. jaspr_lints adds the framework's own checks
# as an analyzer plugin. Every override must carry a justification.
# CI runs `dart analyze --fatal-infos`.
include: package:flutter_agent_lints/experimental.yaml

analyzer:
  exclude:
    - build/**
    # Generated by jaspr_builder; committed so `dart test` needs no build step.
    - lib/**.options.dart

plugins:
  jaspr_lints:
    version: ^0.7.2
    diagnostics:
      prefer_html_components: true
      sort_children_last: true
      styles_ordering: true
