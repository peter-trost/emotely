# Policy: deny-by-default lints (see CLAUDE.md). very_good_analysis is the
# strictest widely-maintained ruleset; every disabled rule below must carry
# a justification comment. CI runs `flutter analyze --fatal-infos`.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
