# Policy: deny-by-default lints (see CLAUDE.md). very_good_analysis is the
# strictest widely-maintained ruleset; every disabled rule below must carry
# a justification comment. CI runs `flutter analyze --fatal-infos`.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated code (freezed / json_serializable / mockito) is not ours to
    # lint; build_runner regenerates it and CI fails on drift (--only-check).
    - '**/*.freezed.dart'
    - '**/*.g.dart'
    - '**/*.mocks.dart'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
